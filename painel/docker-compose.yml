services:
  painel:
    build: .
    container_name: painel-relatorios
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      # 127.0.0.1 em vez de localhost: no Alpine, localhost resolve para ::1
      # (IPv6), mas o Next standalone só ouve em 0.0.0.0 (IPv4).
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
